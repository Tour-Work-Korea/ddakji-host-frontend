name: Build Android Release AAB

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # 1. AWS OIDC (브랜치별 Role 분기)
      # --------------------------------
      - name: Configure AWS credentials (DEV)
        if: github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590052531747:role/github-actions-workaway-ios-dev
          aws-region: ap-northeast-2

      - name: Configure AWS credentials (PROD)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590052531747:role/github-actions-workaway-ios-prod
          aws-region: ap-northeast-2
      

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Load Android env from AWS SSM
        run: |
          BRANCH="${GITHUB_REF##*/}"

          if [ "$BRANCH" = "develop" ]; then
            ENV=dev
          else
            ENV=prod
          fi

          BASE_PATH="/workaway/$ENV/android"

          echo "Loading env from $BASE_PATH"

          cat <<EOF > .env.production
          API_BASE_URL=$(aws ssm get-parameter --name $BASE_PATH/API_BASE_URL --with-decryption --query Parameter.Value --output text)
          WEB_BASE_URL=$(aws ssm get-parameter --name $BASE_PATH/WEB_BASE_URL --with-decryption --query Parameter.Value --output text)
          EOF

      - name: Copy .env.production to .env
        run: cp .env.production .env

      - name: Set CI app version
        run: |
          VERSION_OFFSET=1000
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "CI_VERSION_CODE=$((VERSION_OFFSET + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/ddakji-host-release-key.jks

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Set keystore env
        run: |
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/ddakji-host-release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # - name: Build Release APK
      #   working-directory: android
      #   env:
      #     ENVFILE: .env.production
      #   run: ./gradlew assembleRelease

      # - name: Upload APK Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-apk
      #     path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build Release AAB
        working-directory: android
        env:
          ENVFILE: .env.production
        run: ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ env.CI_VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Google Play 배포
      - name: Deploy to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.ddakjihostapp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          # TestFlight와 같은 역할을 하는 '내부 테스트' 트랙
          track: internal  
          status: completed 
          # 필요하다면 출시 노트를 작성할 수 있습니다. (폴더가 없으면 에러가 날 수 있어 주석 유지)
          # whatsNewDirectory: android/release-notes

      - name: Notify Discord (Host Android)
        if: always()
        run: |
          BRANCH="${GITHUB_REF##*/}"
      
          if [ "$BRANCH" = "develop" ]; then
            ENV_NAME="🧪 DEV"
          else
            ENV_NAME="🚀 PROD"
          fi
      
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            MSG="🏠🤖 Host Android 빌드 성공"
          else
            COLOR=15158332
            MSG="❌ Host Android 빌드 실패"
          fi
      
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"$MSG\",
              \"description\": \"환경: $ENV_NAME\n브랜치: $BRANCH\nRun: #${{ github.run_number }}\n작성자: ${{ github.actor }}\n링크: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"color\": $COLOR
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
